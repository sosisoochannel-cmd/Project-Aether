# Temporary, one-off helper: hand the newest published APK over as an ordinary ZIP on a public host,
# and prove the APK inside is byte-identical to the release asset. It builds nothing.
#
# The phone finishes a ZIP download from these hosts but not a bare .apk one, and the private
# repository's own download needs a session. Deleted again once the link has been handed over.
#
# Neither this file nor tools/ci/** is watched by the build workflow (both are in its paths-ignore),
# so using this never spends an Android build.
name: Relay APK (temporary)

on:
  push:
    branches:
      - arena/01a10203-project-aether
    paths:
      - '.github/workflows/relay-apk.yml'
      - 'tools/ci/**'

# actions:read is what the artifact listing needs; naming any permission leaves the rest at none,
# so this job has to ask for it explicitly.
permissions:
  actions: read
  checks: read
  contents: read

jobs:
  relay:
    name: Zip the newest built APK and verify what is inside
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # No pinned run: the script takes the newest successful Android build on this branch, and reads
      # the size and hash that run recorded for its own APK. Nothing here to keep in step by hand.
      - name: Publish the ZIP and hash the APK inside it back
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/ci/relay_zip.sh

  frames:
    name: Hand the rendered intro frames over
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Each frame comes out as numbered parts of base64, because GitHub keeps only about 4 KB of an
      # annotation, and as two ordinary image links verified by downloading them back.
      - name: Fetch the newest render artifact and send the frames
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/ci/relay_frames.sh

      - name: Keep the links in the run, as a file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-links
          path: links.txt
          if-no-files-found: ignore
