# Temporary, one-off helper: the APK that is already published on the release now sits inside an
# ordinary ZIP on two public hosts. This last step fetches both links whole with a mobile browser
# user-agent, unpacks them and hashes the APK inside. It builds nothing and uploads nothing.
#
# It exists because the sandbox this project is worked from cannot reach third-party hosts (and
# cannot reach the release CDN either), while a runner can. It is deleted again as soon as the link
# has been handed over; the work it did is in the run's annotations and in links.txt.
#
# Triggered only by a change to its own files, and the build workflow ignores those same paths, so
# using this never spends a Unity build.
name: Relay APK (temporary)

on:
  push:
    branches:
      - arena/01a10203-project-aether
    paths:
      - '.github/workflows/relay-apk.yml'
      - 'tools/ci/**'

permissions:
  contents: read

jobs:
  relay:
    name: Verify the published ZIP links
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check the published ZIP links as a phone would fetch them
        run: bash tools/ci/verify_zip_links.sh

      - name: Keep the links in the run, as a file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-links
          path: links.txt
          if-no-files-found: ignore
