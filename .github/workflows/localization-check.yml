name: Localization checks

on:
  push:
    paths:
      - "Assets/Aether/Scenes/MainMenu.unity"
      - "Assets/Aether/Code/Aether.Core/Runtime/Localization/**"
      - "Assets/Aether/Code/Aether.Gameplay/Runtime/Localization/**"
      - "Assets/Aether/Code/Aether.Gameplay/Runtime/Menus/MenuStrings.cs"
      - "Assets/Aether/Code/Aether.Gameplay/Runtime/Menus/MenuScreens.cs"
      - "Assets/Aether/Code/Aether.Gameplay/Runtime/Menus/MenuUi.cs"
      - "Assets/Aether/Code/Aether.Gameplay/Runtime/Menus/MenuTheme.cs"
      - "Assets/Aether/Code/Aether.Gameplay/Runtime/Menus/Components/**"
      - "Assets/Aether/Code/Aether.Gameplay/Runtime/Menus/Panels/**"
      - "tools/verify/mainmenu.py"
      - "Assets/Aether/Code/Aether.Gameplay/Runtime/Menus/MenuUi.cs"
      - "Assets/Aether/Code/Aether.Gameplay/Runtime/Menus/MenuTheme.cs"
      - "Assets/Aether/Code/Aether.Gameplay/Runtime/Menus/Components/**"
      - "Assets/Aether/Code/Aether.Gameplay/Runtime/Menus/Panels/**"
      - "tools/verify/mainmenu.py"
      - "Assets/Aether/Code/Aether.Gameplay/Runtime/Menus/Screens/**"
      - "Assets/Aether/Code/Aether.Tests.PlayMode/**"
      - "tools/localization/**"
      - "tools/verify/localization.py"
      - "tools/verify/content_advisory.py"
      - ".github/workflows/localization-check.yml"
  pull_request:
    paths:
      - "Assets/Aether/Code/Aether.Core/Runtime/Localization/**"
      - "Assets/Aether/Code/Aether.Gameplay/Runtime/Localization/**"
      - "Assets/Aether/Code/Aether.Gameplay/Runtime/Menus/MenuStrings.cs"
      - "Assets/Aether/Code/Aether.Gameplay/Runtime/Menus/MenuScreens.cs"
      - "Assets/Aether/Code/Aether.Gameplay/Runtime/Menus/Screens/**"
      - "Assets/Aether/Code/Aether.Tests.PlayMode/**"
      - "tools/localization/**"
      - "tools/verify/localization.py"
      - "tools/verify/content_advisory.py"
      - ".github/workflows/localization-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-localization:
    name: Verify localization tables and placeholders
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate verifier syntax
        run: python -m py_compile tools/verify/localization.py tools/verify/content_advisory.py
      - name: Validate content-advisory flow and all ten localized copies
        run: python tools/verify/content_advisory.py
      - name: Validate all offered translation sheets and generated tables
        run: python tools/verify/localization.py
      - name: Check menu layout verifier syntax
        run: python -m py_compile tools/verify/mainmenu.py
      - name: Verify menu composition and text bounds
        run: python tools/verify/mainmenu.py
      - name: Report coverage for all ten agreed languages
        run: python tools/verify/localization.py --coverage
