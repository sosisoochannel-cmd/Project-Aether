# Publishes the APK that a specific, already-finished build produced.
#
# Why this exists: run 37224969838 (commit 5fd4384) built a real APK and uploaded it as the
# `Aether-dev-apk` artifact, but the release job in `android-build.yml` was skipped because its
# guard compared the build job's `apk_found` output against the string 'true' while that output
# was written as the integer 1. That guard is fixed there; this workflow is the one-off that
# publishes the artefact that build already produced, without spending another 40 minutes of
# runner time rebuilding identical bytes.
#
# It is pinned to the run and commit it publishes, verifies the APK before offering it, and is
# triggered by its own file only, so it can never fire off another build's output by accident.
# It gets deleted once the fixed pipeline has published a release of its own.
#
# Everything this run learns is sent as annotations, because a job log and an uploaded artifact
# both live on a host that not every client can reach.

name: Publish an existing APK artifact

on:
  push:
    paths:
      - '.github/workflows/publish-apk.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish the APK from run 37224969838
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: '5fd4384'
      SOURCE_RUN: '37224969838'
    steps:
      - name: Download the APK artifact the build produced
        uses: actions/download-artifact@v4
        with:
          name: Aether-dev-apk
          run-id: 37224969838
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release

      - name: Identify the file and hash it
        id: file
        run: |
          set -euo pipefail
          apk=$(find release -name '*.apk' | sort | head -1)
          if [ -z "$apk" ]; then
            echo "::error::The artifact contains no .apk file."
            exit 1
          fi
          size=$(stat -c %s "$apk")
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          file -b "$apk" || true
          {
            echo "path=$apk"
            echo "size=$size"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=APK bytes::$size bytes - sha256 $sha"

      # An APK is a zip whose bytes have to add up: a binary manifest, dalvik code, resources,
      # native libraries, Unity's player data, this project's own assemblies, and a signature.
      # python rather than a heredoc inside a shell step, so the evidence can be printed without
      # quoting games.
      - name: Verify the APK's structure and signature
        shell: python
        env:
          APK: ${{ steps.file.outputs.path }}
        run: |
          import hashlib, os, sys, zipfile

          path = os.environ["APK"]
          data = open(path, "rb").read()
          lines = []
          def say(text):
              lines.append(text)
              print(text)

          say("APK file  : %s" % path)
          say("size      : %d bytes" % len(data))
          say("sha256    : %s" % hashlib.sha256(data).hexdigest())
          say("zip magic : %s" % ("ok" if data[:4] == b"PK\x03\x04" else repr(data[:4])))
          # v2/v3 APK signatures live in an "APK Signing Block" between the entries and the central
          # directory; v1 signatures are META-INF/*.RSA. Either one is a real signature.
          say("v2/v3 signing block: %s" % ("present" if b"APK Sig Block 42" in data else "absent"))

          # Two lists: what has to be true for the bytes to be an installable Android package at
          # all, and what is merely worth reporting. Failing to find a managed assembly, for
          # instance, is expected in an IL2CPP build - the C# is compiled into native code and
          # there is nothing left to find - so that is evidence, not a gate.
          gates = []
          notes = []

          with zipfile.ZipFile(path) as archive:
              names = archive.namelist()
              bad = archive.testzip()
          say("entries   : %d" % len(names))
          say("zip test  : %s" % ("every entry read back intact" if bad is None else "CORRUPT at %s" % bad))
          if bad is not None:
              gates.append("zip integrity")

          for required in ("AndroidManifest.xml", "classes.dex"):
              present = required in names
              say("required  : %-20s %s" % (required, "present" if present else "MISSING"))
              if not present:
                  gates.append(required)

          for expected in ("resources.arsc",):
              say("expected  : %-20s %s" % (expected, "present" if expected in names else "MISSING"))
              if expected not in names:
                  notes.append(expected)

          v1 = sorted(n for n in names if n.startswith("META-INF/") and n.endswith((".RSA", ".DSA", ".EC")))
          signed = bool(v1) or b"APK Sig Block 42" in data
          say("signature : %s" % ("v1 " + ", ".join(v1) if v1 else "no v1 files; WARNING" if not signed else "v2/v3 signing block only"))
          say("signed    : %s" % ("yes" if signed else "NO"))
          if not signed:
              gates.append("signature")

          abis = sorted({n.split("/")[1] for n in names if n.startswith("lib/") and n.count("/") >= 2})
          native = [n for n in names if n.startswith("lib/") and n.endswith(".so")]
          say("abis      : %s" % (", ".join(abis) if abis else "none"))
          say("native    : %d shared libraries" % len(native))
          for n in native[:6]:
              say("              " + n)
          if not native:
              notes.append("native libraries")

          il2cpp = [n for n in names if "il2cpp" in n.lower() or n.endswith("global-metadata.dat")]
          say("il2cpp    : %d entries%s" % (len(il2cpp), (" (" + ", ".join(os.path.basename(n) for n in il2cpp[:3]) + ")") if il2cpp else ""))

          unity = [n for n in names if n.startswith("assets/bin/Data/")]
          say("player data: %d entries" % len(unity))
          for n in unity[:8]:
              say("              " + n)
          if not unity:
              notes.append("unity player data")

          managed = [n for n in names if n.startswith("assets/bin/Data/Managed/")]
          own = [n for n in managed if "Aether" in n]
          say("managed    : %d entries under Managed/, of which Aether: %d (IL2CPP builds have none - expected)" % (len(managed), len(own)))

          with open("/tmp/evidence.txt", "w") as fh:
              fh.write("\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("```\n" + "\n".join(lines) + "\n```\n")

          verdict = "installable signed APK" if not gates else "problems: " + ", ".join(gates)
          print("VERDICT: %s" % verdict)
          if gates:
              print("NOTE: this run refuses to publish, but the evidence above is still reported.")
              sys.exit(1)

      - name: Send the evidence as an annotation
        if: always()
        run: |
          if [ -f /tmp/evidence.txt ]; then
            body=$(sed -e 's/%/%25/g' -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g' /tmp/evidence.txt)
            echo "::notice title=APK evidence::$body"
          fi

      - name: What this token is actually allowed to do
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          setting=$(gh api "repos/$GITHUB_REPOSITORY/actions/permissions/workflow" 2>&1 | tr -d '\r\n' | head -c 300 || true)
          echo "default workflow permissions: $setting"
          echo "::notice title=Repo workflow permission setting::${setting}"

          # A harmless write test: create a throwaway branch and delete it again. This separates
          # "the token may not write" from "the release call was malformed".
          if out=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                     -f "ref=refs/heads/token-write-probe-${GITHUB_RUN_ID}" -f "sha=$GITHUB_SHA" 2>&1); then
            echo "write test: a ref could be created, so this token can write contents"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/token-write-probe-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
            echo "::notice title=Token write test::contents write ALLOWED for this job token"
          else
            flat=$(printf '%s' "$out" | tr '\n' '|' | head -c 300)
            echo "write test refused: $flat"
            echo "::notice title=Token write test::contents write REFUSED - $flat"
          fi

      - name: Try the GitHub release, then a public mirror
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SIZE: ${{ steps.file.outputs.size }}
          SHA: ${{ steps.file.outputs.sha }}
          TAG: apk-5fd4384
        run: |
          set -uo pipefail
          asset="Aether_0.1.0_${SOURCE_SHA}.apk"
          cp "${{ steps.file.outputs.path }}" "$asset"
          sha256sum "$asset" > SHA256SUMS.txt
          cat SHA256SUMS.txt

          notes="Android debug build of Project Aether (Unity 6000.3.24f1) from commit $SOURCE_SHA, produced by the Android APK workflow in run $SOURCE_RUN and published from that run's artifact. Asset $asset, $SIZE bytes, sha256 $SHA."

          # The release API creates the tag for you when it is missing, and a tag creation that is
          # refused looks exactly like a release that is refused - both are a 403 on /releases. So
          # the tag is created deliberately first, through the same write path the token has already
          # been shown to have, and the two outcomes are kept apart in the report.
          target=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA" --jq '.sha' 2>/dev/null || true)
          echo "tag will point at $SOURCE_SHA -> ${target:-unknown}"
          if [ -n "$target" ]; then
            if gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                 -f "ref=refs/tags/$TAG" -f "sha=$target" >/tmp/tag.json 2>/tmp/tag.err; then
              echo "::notice title=Tag created::$TAG -> $target"
            else
              echo "::warning title=Tag creation refused::$(printf '%s' "$(cat /tmp/tag.err)" | tr '\n' '|' | tail -c 300)"
            fi
          fi

          published=no
          if gh release view "$TAG" >/dev/null 2>&1; then
            if out=$(gh release upload "$TAG" "$asset" SHA256SUMS.txt --clobber 2>&1); then
              published=yes
            else
              echo "::warning title=Release upload refused::$(printf '%s' "$out" | tr '\n' '|' | tail -c 300)"
            fi
          else
            if out=$(gh release create "$TAG" --verify-tag --title "Aether dev build ${TAG#apk-}" \
                       --notes "$notes" 2>&1); then
              if gh release upload "$TAG" "$asset" SHA256SUMS.txt --clobber >/dev/null 2>&1; then
                published=yes
              fi
            else
              echo "::warning title=Release create refused::$(printf '%s' "$out" | tr '\n' '|' | tail -c 300)"
              # Ask the API directly, so its own answer - including the header that names the
              # permission it wanted - is in the report instead of an interpretation of it.
              curl -sS -i --max-time 60 -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" \
                -H "Authorization: token $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                -d "{\"tag_name\":\"$TAG\",\"name\":\"aether probe\",\"draft\":true}" \
                -o /tmp/rel.out 2>/dev/null || true
              echo "::warning title=Release API answered::$(head -c 700 /tmp/rel.out | tr -d '\r' | tr '\n' '|')"
            fi
          fi

          if [ "$published" = yes ]; then
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$asset"
            echo "::notice title=Release published::$url - $SIZE bytes - sha256 $SHA"
          fi

          # A link that no repository permission can block, offered only if the bytes really come
          # back: the file is uploaded, fetched again, and hashed. Several hosts are tried in turn
          # and every answer is recorded, because which of them a runner's address may reach is not
          # something this file can know, and a silent failure here would be indistinguishable from
          # no host at all.
          report=""
          note() { report="$report || $1"; }
          UA='User-Agent: Project-Aether-CI/1.0 (+https://github.com/sosisoochannel-cmd/Project-Aether)'
          mirror=""

          # pixeldrain: PUT the body, read the id out of the JSON answer.
          code=$(curl -sS --max-time 180 -o /tmp/h.out -w '%{http_code}' -T "$asset" \
                   https://pixeldrain.com/api/file/ 2>/tmp/h.err) || true
          body=$(head -c 160 /tmp/h.out 2>/dev/null | tr -d '\r\n')
          err=$(head -c 160 /tmp/h.err 2>/dev/null | tr -d '\r\n')
          note "pixeldrain http=${code:-none} out=${body:-empty} err=${err:-none}"
          id=$(printf '%s' "$body" | sed -n 's/.*"id":"\([A-Za-z0-9]*\)".*/\1/p')
          if [ -n "$id" ]; then
            mirror="https://pixeldrain.com/api/file/$id?download"
          fi

          if [ -z "$mirror" ]; then
            rm -f /tmp/h.out /tmp/h.err
          code=$(curl -sS --max-time 180 -o /tmp/h.out -w '%{http_code}' -H "$UA" \
                     -F "file=@$asset" https://0x0.st 2>/tmp/h.err) || true
            body=$(head -c 160 /tmp/h.out 2>/dev/null | tr -d '\r\n')
            note "0x0.st http=${code:-none} out=${body:-empty}"
            case "$body" in https://*) mirror="$body" ;; esac
          fi

          if [ -z "$mirror" ]; then
            rm -f /tmp/h.out /tmp/h.err
            bin="aether-${SOURCE_SHA}-$(date -u +%Y%m%d%H%M%S)"
            code=$(curl -sS --max-time 300 -o /tmp/h.out -w '%{http_code}' -X DELETE \
                     "https://filebin.net/$bin" 2>/tmp/h.err) || true
            code=$(curl -sS --max-time 300 -o /tmp/h.out -w '%{http_code}' -X POST \
                     --data-binary "@$asset" -H "$UA" -H 'Content-Type: application/octet-stream' \
                     "https://filebin.net/$bin/$(basename "$asset")" 2>/tmp/h.err) || true
            body=$(head -c 160 /tmp/h.out 2>/dev/null | tr -d '\r\n')
            note "filebin http=${code:-none} out=${body:-empty}"
            if [ "$code" = 201 ]; then
              mirror="https://filebin.net/$bin/$(basename "$asset")/$(basename "$asset")"
            fi
          fi

          if [ -z "$mirror" ]; then
            rm -f /tmp/h.out /tmp/h.err
            code=$(curl -sS --max-time 180 -o /tmp/h.out -w '%{http_code}' -T "$asset" \
                     -H "$UA" "https://bashupload.com/$(basename "$asset")" 2>/tmp/h.err) || true
            body=$(head -c 300 /tmp/h.out 2>/dev/null | tr -d '\r\n')
            note "bashupload http=${code:-none} out=${body:-empty}"
            got=$(printf '%s' "$body" | grep -o 'https://bashupload.com/[^ ]*' | head -1 || true)
            if [ -n "$got" ]; then
              mirror="$got"
            fi
          fi

          echo "::warning title=Mirror attempts::${report# || }"

          if [ -n "$mirror" ]; then
            echo "mirror candidate: $mirror"
            if curl -sS --max-time 600 -L -o roundtrip.bin "$mirror"; then
              back=$(sha256sum roundtrip.bin | cut -d' ' -f1)
              if [ "$back" = "$SHA" ]; then
                echo "::notice title=Direct download (bytes verified by re-download)::$mirror - $SIZE bytes - sha256 $SHA"
              else
                echo "::warning title=Mirror mismatch::re-downloaded bytes hash to $back, not $SHA"
              fi
            else
              echo "::warning title=Mirror unreadable::the uploaded link could not be fetched back"
            fi
          else
            echo "::warning title=No mirror accepted the file::the attempts line above has each host's own answer"
          fi

          {
            echo "### APK"
            echo ""
            echo "- size: $SIZE bytes"
            echo "- sha256: $SHA"
            echo "- GitHub release published: $published"
            echo "- mirror: ${mirror:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
