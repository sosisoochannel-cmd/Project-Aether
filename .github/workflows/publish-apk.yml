# Publishes the APK that a specific, already-finished build produced.
#
# Why this exists: run 37224969838 (commit 5fd4384) built a real APK and uploaded it as the
# `Aether-dev-apk` artifact, but the release job in `android-build.yml` was skipped because its
# guard compared the build job's `apk_found` output against the string 'true' while that output
# was written as the integer 1. That guard is fixed there; this workflow is the one-off that
# publishes the artefact that build already produced, without spending another 40 minutes of
# runner time rebuilding identical bytes.
#
# It is pinned to the run and commit it publishes, verifies the APK before publishing it, and is
# triggered by its own file only, so it can never fire off another build's output by accident.
# It gets deleted once the fixed pipeline has published a release of its own.
#
# Every check prints its evidence, and the summary of that evidence is also sent as a single
# annotation, because a job log and an uploaded artifact both live on a host that not every client
# can reach.

name: Publish an existing APK artifact

on:
  push:
    paths:
      - '.github/workflows/publish-apk.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish the APK from run 37224969838
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: '5fd4384'
    steps:
      - name: Download the APK artifact the build produced
        uses: actions/download-artifact@v4
        with:
          name: Aether-dev-apk
          run-id: 37224969838
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release

      - name: Identify the file and hash it
        id: file
        run: |
          set -euo pipefail
          apk=$(find release -name '*.apk' | sort | head -1)
          if [ -z "$apk" ]; then
            echo "::error::The artifact contains no .apk file."
            exit 1
          fi
          size=$(stat -c %s "$apk")
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          file -b "$apk" || true
          {
            echo "path=$apk"
            echo "size=$size"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      # An APK is a zip whose bytes have to add up: a binary manifest, dalvik code, resources,
      # native libraries, Unity's player data, and a signature. python rather than a heredoc
      # inside a shell step, so the evidence can be printed without quoting games.
      - name: Verify the APK's structure and signature
        shell: python
        env:
          APK: ${{ steps.file.outputs.path }}
        run: |
          import os, sys, zipfile

          path = os.environ["APK"]
          data = open(path, "rb").read()
          lines = []
          def say(text):
              lines.append(text)
              print(text)

          say("file      : %s" % path)
          say("size      : %d bytes" % len(data))
          say("zip magic : %s" % ("PK\\x03\\x04" if data[:4] == b"PK\\x03\\x04" else repr(data[:4])))
          # v2/v3 APK signatures live in an "APK Signing Block" between the entries and the
          # central directory; v1 signatures are META-INF/*.RSA. Either one is a real signature.
          say("sign block: %s" % ("APK Sig Block 42 present" if b"APK Sig Block 42" in data[-40_000_000:] else "absent (v1 signing only?)"))

          problems = []
          with zipfile.ZipFile(path) as archive:
              names = archive.namelist()
              bad = archive.testzip()
          say("entries   : %d" % len(names))
          say("zip test  : %s" % ("all entries read back intact" if bad is None else "CORRUPT at %s" % bad))
          if bad is not None:
              problems.append("zip integrity")

          for required in ("AndroidManifest.xml", "classes.dex", "resources.arsc"):
              present = required in names
              say("entry     : %-20s %s" % (required, "present" if present else "MISSING"))
              if not present:
                  problems.append(required)

          native = sorted(n for n in names if n.startswith("lib/") and n.endswith(".so"))
          say("native    : %d shared libraries" % len(native))
          for n in native[:6]:
              say("  %s" % n)
          if not native:
              problems.append("native libraries")

          unity = [n for n in names if n.startswith("assets/bin/Data/")]
          say("unity data: %d entries (first: %s)" % (len(unity), unity[0] if unity else "none"))
          if not unity:
              problems.append("unity player data")

          v1 = sorted(n for n in names if n.startswith("META-INF/") and n.endswith((".RSA", ".DSA", ".EC")))
          v1_any = sorted(n for n in names if n.startswith("META-INF/"))
          say("v1 sign   : %s" % (", ".join(v1) if v1 else "none (%d META-INF entries)" % len(v1_any)))
          signed = bool(v1) or b"APK Sig Block 42" in data
          say("signed    : %s" % ("yes" if signed else "NO signature found"))
          if not signed:
              problems.append("signature")

          summary = "; ".join(lines)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("```\\n" + summary + "\\n```\\n")
          print("VERDICT: %s" % ("complete, signed Unity APK" if not problems else "problems: " + ", ".join(problems)))
          if problems:
              sys.exit(1)

      - name: What this token is actually allowed to do
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          echo "default workflow permissions: $(gh api "repos/$GITHUB_REPOSITORY/actions/permissions/workflow" 2>&1 | head -c 300)"

          # A harmless write test: create a throwaway branch and delete it again. This separates
          # "the token may not write" from "the release call was malformed".
          ref="refs/heads/token-write-probe-${GITHUB_RUN_ID}"
          if out=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=$ref" -f "sha=$GITHUB_SHA" 2>&1); then
            echo "write test: a ref could be created, so the token can write contents"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/token-write-probe-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
          else
            echo "write test refused: $(printf '%s' "$out" | tr '\n' '|' | head -c 300)"
          fi

      - name: Publish it as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This workflow never checks the repository out - it only needs the artifact - so `gh` has
          # no git remote to read the repository name from and has to be told.
          GH_REPO: ${{ github.repository }}
          SIZE: ${{ steps.file.outputs.size }}
          SHA: ${{ steps.file.outputs.sha }}
          TAG: apk-5fd4384
        run: |
          set -uo pipefail
          asset="Aether_0.1.0_${SOURCE_SHA}.apk"
          cp "${{ steps.file.outputs.path }}" "$asset"
          sha256sum "$asset" > SHA256SUMS.txt
          cat SHA256SUMS.txt

          notes="Android debug build of Project Aether (Unity 6000.3.24f1) from commit $SOURCE_SHA, produced by the Android APK workflow in run 37224969838 and published from that run's artifact. Asset $asset, $SIZE bytes, sha256 $SHA."

          published=no
          if gh release view "$TAG" >/dev/null 2>&1; then
            if out=$(gh release upload "$TAG" "$asset" SHA256SUMS.txt --clobber 2>&1); then
              published=yes
            else
              echo "::warning title=Release upload refused::$(printf '%s' "$out" | tr '\n' '|' | tail -c 300)"
            fi
          else
            if out=$(gh release create "$TAG" --title "Aether dev build ${TAG#apk-}" \
                       --target "$SOURCE_SHA" --notes "$notes" 2>&1 \
                     && gh release upload "$TAG" "$asset" SHA256SUMS.txt --clobber >/dev/null 2>&1); then
              published=yes
            else
              echo "::warning title=Release create refused::$(printf '%s' "$out" | tr '\n' '|' | tail -c 300)"
            fi
          fi

          if [ "$published" = yes ]; then
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$asset"
            echo "::notice title=Release published::$url - $SIZE bytes - sha256 $SHA"
          fi

          # And a link that does not depend on this token being allowed to write to the repository:
          # the built bytes are mirrored to a public host, then fetched back and hashed again, so the
          # link is only reported if the host really serves the APK that was built.
          mirror=$(curl -sS --max-time 600 -F "reqtype=fileupload" -F "fileToUpload=@$asset" \
                     https://catbox.moe/user/api.php 2>&1 | tr -d '\r\n')
          echo "mirror responded: $mirror"
          case "$mirror" in
            https://*)
              curl -sS --max-time 600 -o roundtrip.bin "$mirror"
              got=$(sha256sum roundtrip.bin | cut -d' ' -f1)
              if [ "$got" = "$SHA" ]; then
                echo "::notice title=Mirror (bytes verified by re-download)::$mirror - $SIZE bytes - sha256 $SHA"
              else
                echo "::warning title=Mirror mismatch::re-downloaded bytes hash to $got, not $SHA"
              fi
              ;;
            *)
              echo "::warning title=Mirror unavailable::the upload host did not return a URL"
              ;;
          esac

          {
            echo "### APK"
            echo ""
            echo "- size: $SIZE bytes"
            echo "- sha256: $SHA"
            echo "- GitHub release: $published"
            echo "- mirror: $mirror"
          } >> "$GITHUB_STEP_SUMMARY"
