# Android APK build for Project Aether, on GitHub's own runners.
#
# The pipeline in one line: check out the repository, let GameCI provide Unity 6000.3.24f1 in a
# container, activate the Unity Personal license from the account's own credentials, build an
# Android APK, and upload it as a downloadable artifact.
#
# **Nothing here needs a PC.** Unity's editor, the Android SDK/NDK and the JDK all live on
# GitHub's runner for the length of the job; the only things the account owner supplies are their
# Unity account email and password, stored as repository secrets. See docs/CI.md.
#
# Licensing, stated plainly because this is the part people get wrong: no .ulf file and no serial
# key are used. GameCI's CLI resolves the licensing strategy itself in the order
# file -> serial -> floating -> personal, and with only account credentials present it activates a
# Personal seat inside the container and returns it when the build ends. That is a real,
# account-bound Unity Personal license being used exactly as Unity's own tooling intends — not a
# bypass, not a cracked license, and not a fabricated one. The strategy order and the
# activate/return pairing are in game-ci/cli (`licensing-method.ts`, `run-licensing-probe-cell.sh`),
# and the only cell GameCI records as failing across the versions they measure is 2020.3.49f1,
# whose bundled licensing client predates the `--include-personal` flag this path needs.

name: Android APK

on:
  # Release builds are manual; polish commits must not spend Android build minutes.
  push:
    branches:
      - main
      # Temporary gameplay-test lane: the owner explicitly requested a build of this polish branch.
      - arena/ultimate-visual-polish
    # Documentation cannot change an APK, and a build spends real minutes from the month's free
    # allowance, so a docs-only push should not start one.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      # CI plumbing that cannot change a single byte of the game. The build workflow is in this
      # list on purpose: editing the recipe should not spend a build, and it is what lets a
      # temporary helper be added and taken out again without rebuilding the APK.
      - '.github/workflows/android-build.yml'
      - '.github/workflows/relay-apk.yml'
      - '.github/workflows/intro-render.yml'
      - 'tools/ci/**'
      # The verification tools cannot change a byte of the game either: they read the project's
      # sources and prove things about them. Editing a gate must not spend a build.
      - 'tools/verify/**'
      # The play-mode tests are an editor-only assembly (includePlatforms: Editor, and gated on
      # UNITY_INCLUDE_TESTS), so nothing under here can reach a player build. Editing the render
      # test would otherwise spend a Unity Android build to prove that nothing in the APK changed.
      - 'Assets/Aether/Code/Aether.Tests.PlayMode/**'
  workflow_dispatch:

permissions:
  contents: read

# A build spends the account's monthly Actions minutes, and a run cancelled mid-build can leave a
# Personal seat bound to a machine that no longer exists — released by hand at id.unity.com. So a
# newer push queues behind the older run instead of killing it.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check Unity credentials
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Verify the secrets exist
        id: check
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSING_SERVER: ${{ secrets.UNITY_LICENSING_SERVER }}
        run: |
          # Values are never printed; only whether they are present.
          ready=true
          if [ -z "$UNITY_EMAIL" ]; then
            echo "::warning::Repository secret UNITY_EMAIL is missing, so no license can be activated."
            ready=false
          fi
          if [ -z "$UNITY_PASSWORD" ]; then
            echo "::warning::Repository secret UNITY_PASSWORD is missing, so no license can be activated."
            ready=false
          fi
          if [ "$ready" = "true" ]; then
            echo "Unity account credentials are present. The build job will run."
          else
            echo "Add both secrets under Settings -> Secrets and variables -> Actions, then re-run this workflow from the Actions tab."
          fi

          # Shape checks, booleans only — the values themselves never reach the log. Unity answers a
          # password with a stray trailing space or newline exactly as it answers a wrong password
          # ("credentials rejected"), and pasting on a phone is where that usually comes from.
          email_shape="no"; email_ws="clean"
          case "$UNITY_EMAIL" in *@*.*) email_shape="yes";; esac
          case "$UNITY_EMAIL" in *[[:space:]]*) email_ws="contains whitespace";; esac
          pw_ws="clean"; pw_len="too short"
          case "$UNITY_PASSWORD" in *[[:space:]]*) pw_ws="contains whitespace";; esac
          [ "${#UNITY_PASSWORD}" -ge 8 ] && pw_len="at least 8 characters"
          echo "::notice title=Credential shape::UNITY_EMAIL looks like an address: $email_shape (whitespace: $email_ws); UNITY_PASSWORD length: $pw_len (whitespace: $pw_ws)"

          # Which licensing credentials exist decides which strategy GameCI picks on its own, and a
          # stray .ulf or serial silently outranks the account credentials in that choice. Names
          # only - never values.
          present=""
          [ -n "$UNITY_LICENSE" ] && present="$present UNITY_LICENSE"
          [ -n "$UNITY_SERIAL" ] && present="$present UNITY_SERIAL"
          [ -n "$UNITY_LICENSING_SERVER" ] && present="$present UNITY_LICENSING_SERVER"
          if [ -z "$present" ]; then present="none (account credentials only, which means the personal strategy)"; fi
          echo "::notice title=Other licence secrets::$present"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

  apk:
    name: Unity 6000.3.24f1 -> Aether-dev.apk
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # `checks: write` is what lets the last step post the captured log back as check-run payloads;
    # the job otherwise only reads the repository.
    permissions:
      contents: read
      checks: write
    outputs:
      apk_found: ${{ steps.report.outputs.apk_found }}
      apk_name: ${{ steps.report.outputs.apk_name }}
      apk_size: ${{ steps.report.outputs.apk_size }}
      apk_sha: ${{ steps.report.outputs.apk_sha }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Library is Unity's import cache. Restoring it turns a multi-minute import into seconds.
      # Restore and save are split deliberately: the combined cache step's implicit post-run save
      # has been observed hanging on hosted runners (see the comment in GameCI's own build
      # workflow), and an explicit step can be bounded by a timeout.
      # Why this exists: GitHub gives a *private* repository's runner a 2-core VM with a 75 GB disk of
      # which only ~14 GB is free (actions/runner-images#14492, GitHub staff, 2026-08-05; public repos
      # get 150 GB with ~90 GB free), and the Unity Android image must unpack far more than that into
      # /var/lib/docker. That is exactly how the first real run died:
      #   docker: failed to register layer: write .../AndroidPlayer/Variations/il2cpp/.../libunity.so:
      #   no space left on device
      # GameCI's own troubleshooting page names this failure and its first remedy is to free disk
      # space. Every path below is a host-side toolchain that a *container* build cannot use: the
      # editor, the Android SDK/NDK and the JDK all live inside the unityci/editor image, this
      # workflow calls no setup-* action, and unity-builder v6 is a node24 action that runs on the
      # runner's bundled Node rather than anything in the tool cache. Deliberately untouched: the
      # workspace and .git, the Unity project, the actions runtime, the Docker daemon, and swap —
      # the standard runner has 8 GB of RAM and an IL2CPP build is the thing most likely to want it.
      - name: Free disk space
        id: space
        run: |
          set -euo pipefail

          free_mb() { df -Pk / | awk 'NR==2 {print int($4/1024)}'; }

          before=$(free_mb)
          total=$(df -Ph / | awk 'NR==2 {print $2}')
          echo "=== disk before cleanup ==="
          df -h /
          docker system df || true
          echo "::notice title=Disk before cleanup::$((before/1024)) GB free of ${total} on /"

          saved=0
          remove_path() { # $1 = path, $2 = label
            if [ ! -e "$1" ]; then
              echo "- $2: not present"
              return 0
            fi
            local b a size
            b=$(free_mb)
            size=$(sudo du -sh "$1" 2>/dev/null | cut -f1 || echo "?")
            sudo rm -rf --one-file-system "$1" || true
            a=$(free_mb)
            saved=$(( saved + a - b ))
            echo "- $2: removed $1 (was $size, freed $((a-b)) MB)"
          }

          remove_path /usr/local/lib/android  "host Android SDK/NDK - the build's own SDK is inside the Unity image"
          remove_path "$AGENT_TOOLSDIRECTORY" "pre-installed language runtimes and the CodeQL toolchain"
          remove_path /opt/ghc                "Haskell GHC"
          remove_path /usr/local/.ghcup       "Haskell GHCup data"
          remove_path /usr/share/dotnet       ".NET SDK"
          remove_path /usr/local/share/boost  "Boost headers"

          echo "=== docker prune ==="
          docker image prune --all --force || true
          docker container prune --force || true

          after=$(free_mb)
          echo "=== disk after cleanup ==="
          df -h /
          echo "::notice title=Disk after cleanup::$((after/1024)) GB free on / (was $((before/1024)) GB; ${saved} MB reclaimed)"

          # The image unpacks into /var/lib/docker and the build then needs room for Library/ and the
          # APK. If the fast, file-level cleanup above is not enough, fall back to the slower package
          # sweep from the same documented list, and only then.
          if [ "$((after/1024))" -lt 30 ]; then
            echo "::notice::Under 30 GB free after the file-level cleanup; running the documented package sweep (this takes a few minutes)."
            sudo apt-get remove -y '^llvm-.*' --fix-missing || true
            sudo apt-get remove -y 'php.*' --fix-missing || true
            sudo apt-get remove -y '^mongodb-.*' --fix-missing || true
            sudo apt-get remove -y '^mysql-.*' --fix-missing || true
            sudo apt-get remove -y azure-cli google-chrome-stable firefox powershell mono-devel --fix-missing || true
            sudo apt-get remove -y google-cloud-sdk google-cloud-cli --fix-missing || true
            sudo apt-get autoremove -y || true
            sudo apt-get clean || true
            after=$(free_mb)
            df -h /
            echo "::notice title=Disk after package sweep::$((after/1024)) GB free on /"
          fi

          if [ "$((after/1024))" -lt 25 ]; then
            echo "::warning::Only $((after/1024)) GB free on / after cleanup; the Unity Android image may still not fit."
          fi

      - name: Restore Library cache
        uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-Android-${{ github.sha }}
          restore-keys: |
            Library-Android-

      - name: Install the GameCI CLI
        id: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Pinned, not `latest`: the version that runs is then a fact in the log rather than
          # whatever shipped this morning. This is the same install path the unity-builder action
          # uses (game-ci/cli's own scripts/install.sh, fetched at the tag), so the binary and its
          # checksum verification are GameCI's, not a reimplementation.
          version="v0.1.72"
          script="$RUNNER_TEMP/game-ci-install.sh"
          if ! curl -fsSL "https://raw.githubusercontent.com/game-ci/cli/$version/scripts/install.sh" -o "$script"; then
            # raw.githubusercontent.com is the documented source; the API is the authenticated fallback.
            curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/game-ci/cli/contents/scripts/install.sh?ref=$version" -o "$script"
          fi
          dest="$RUNNER_TEMP/game-ci"
          mkdir -p "$dest"
          bin=$(bash "$script" "$version" "$dest" | tail -n 1)
          test -x "$bin" || { echo "::error::install.sh did not produce an executable ($bin)"; exit 1; }
          "$bin" --version || true
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          echo "::notice title=game-ci CLI::installed $version -> $bin"

      - name: Build APK
        id: build
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # Empty when unset, and only ever used by the second attempt below.
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSING_SERVER: ${{ secrets.UNITY_LICENSING_SERVER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          # The same command the `game-ci/unity-builder` action runs, called directly so the whole
          # output can be captured to a file. Without that file the only copy of a failure is the
          # job log, which is 25,000 lines and not readable from a phone or from the API.
          #
          # --androidTargetSdkVersion is not cosmetic. The GameCI Android image installs
          # platform-tools, build-tools and the NDK, but no `platforms;android-XX` at all: its
          # container entrypoint installs exactly one platform, named by the project's
          # `AndroidTargetSdkVersion`. This project leaves that at 0 (Auto), so the entrypoint asked
          # the SDK manager for `platforms;android-0`, was told "Failed to find package", and Unity
          # was left with no Android platform to compile against. Naming API 35 here installs
          # `platforms;android-35` and hands Unity the same level - the level Google Play requires of
          # new apps in 2025.
          attempt() {
            local method="$1"
            echo "### Attempt: unityLicensingMethod=$method"
            "${{ steps.cli.outputs.bin }}" build \
              --targetPlatform=Android \
              --androidExportType=androidPackage \
              --buildName=Aether-dev \
              --buildsPath=Builds \
              --versioningStrategy=Custom \
              --version=0.1.0 \
              --allowDirtyBuild \
              --androidTargetSdkVersion=35 \
              --unityLicensingMethod="$method" 2>&1 | tee "ci-build-$method.log"
            return "${PIPESTATUS[0]}"
          }

          status=1
          # Personal first, and forced: with only an email and a password configured, `auto` resolves
          # to `personal` anyway, and forcing it means a stray license secret cannot silently switch
          # the strategy out from under the run.
          attempt personal && status=0

          if [ "$status" != 0 ]; then
            # What failed, not what is assumed to have failed: licensing already worked by the time
            # Unity is given the project, and the log says so either way.
            reason=$(grep -hoE 'Build failed, with exit code [0-9]+|Aborting batchmode due to failure.*|Licensing failed.*' ci-build-personal.log | tail -1)
            echo "::notice title=Attempt 1 failed::${reason:-no build result in the log yet}; see ci-build-personal.log"
            # A second attempt is only worth its minutes if the account supplied something the first
            # (forced) strategy was told to ignore - a .ulf or a serial.
            if [ -n "${UNITY_LICENSE:-}" ] || [ -n "${UNITY_SERIAL:-}" ]; then
              echo "A license file or serial secret is present, so retrying with the automatic strategy."
              attempt auto && status=0
            else
              echo "No .ulf and no serial are configured, so there is no second strategy to try."
            fi
          fi

          exit "$status"

      # A failed Unity build is only diagnosable from the container's output, and that output lands in
      # a 25,000-line job log. These lines are re-emitted as workflow commands, which become
      # annotations on the run - visible from a phone, and readable through the API when the log
      # itself is not. Passwords are filtered out on principle even though GitHub masks secret values.
      - name: Surface what the container said
        if: always()
        run: |
          shopt -s nullglob
          files=(ci-build-*.log)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning title=No captured log::The build step produced no ci-build-*.log file."
            exit 0
          fi

          # One annotation can carry many lines if the newlines are escaped, which matters because a
          # check run only keeps a few dozen annotations. %25 first so a literal % in the log cannot
          # be mistaken for an escape.
          emit_digest() {
            local title="$1"
            local body
            body=$(grep -v -- '--password' | cut -c1-400 \
              | sed -e 's/%/%25/g' -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
            [ -z "$body" ] && return 0
            echo "::notice title=${title}::${body}"
          }

          for f in "${files[@]}"; do
            # Unity writes progress updates with carriage returns, not newlines. Without this the
            # compiler errors can end up inside one 200,000-character line, where a line-based grep
            # and a 450-character cut both miss them.
            norm="$RUNNER_TEMP/$(basename "$f" .log)-normalised.log"
            tr '\r' '\n' < "$f" > "$norm"
            cp "$norm" "ci-build-$(basename "$f" .log)-normalised.log"
            echo "::notice title=Captured log::$f - $(wc -l < "$f") raw lines, $(wc -l < "$norm") after normalising"

            # 1. The compile errors, which is what "Scripts have compiler errors" is hiding. Both the
            #    Roslyn shape and the plain Unity asset-path shape. Warnings are excluded on purpose:
            #    a check run keeps only ten annotations per level per step, and GameCI's own vendored
            #    editor scripts emit enough CS0618 warnings to use up all ten and hide the real error.
            grep -nE '\.cs\([0-9]+,[0-9]+\): error|error CS[0-9]{4}|Compilation failed|Scripts have compiler errors' "$norm" \
              | head -40 | cut -c1-400 \
              | while IFS= read -r line; do echo "::error title=Compile error::$line"; done

            # 2. The whole run-up to Unity's own abort reason, as one digest - the errors are usually
            #    in the lines immediately above it.
            reason_line=$(grep -n 'Aborting batchmode due to failure' "$norm" | head -1 | cut -d: -f1)
            if [ -n "${reason_line:-}" ]; then
              first=$(( reason_line > 90 ? reason_line - 90 : 1 ))
              sed -n "${first},${reason_line}p" "$norm" | emit_digest "Lines before Unity aborted"
            fi

            # 3. Anything else that reads like a failure, for when the above finds nothing.
            grep -nEi 'error|exception|failed|unable to|could not|cannot|missing|not found' "$norm" \
              | grep -vEi 'Verifying Checksum|Pulling fs layer|Download complete|Waiting|Extracting|Node\.js 20 is deprecated|DeprecationWarning|warning::|no space left on device:: \(false\)' \
              | tail -25 | tac | cut -c1-400 \
              | while IFS= read -r line; do echo "::warning title=Other log lines::$line"; done

            tail -n 10 "$norm" | emit_digest "Log tail"

            # 4. The end of the log in full, as one multi-line annotation: the failure is almost always
            #    in the last screenful, and one annotation carries far more than the ten-line tail.
            tail -n 120 "$norm" | grep -v -- '--password' | cut -c1-420 \
              | sed -e 's/%/%25/g' -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g' \
              | { read -r body && echo "::notice title=Last 120 log lines::${body}"; }

            # 5. The same tail, freshest line first, so the ten that survive are the most recent.
            tail -n 25 "$norm" | tac | cut -c1-400 \
              | while IFS= read -r line; do echo "::notice title=Log end (newest first)::$line"; done
          done

      # The job log is tens of thousands of lines and the host it is stored on is not reachable from
      # every client that reads a run, so the captured log is handed back through the API too -
      # gzipped, base64'd, and cut to fit what the channels actually allow: a workflow-command message
      # is truncated at 4096 characters, and only the first ten annotations of a step (per level)
      # survive. Hence 3900-character pieces, ten per step, two steps. Diagnostic material only;
      # nothing here feeds the build.
      - name: Prepare the log payload
        if: always()
        run: |
          shopt -s nullglob
          files=(ci-build-*-normalised.log)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning title=No normalised log::Nothing to hand back."
            exit 0
          fi

          for f in "${files[@]}"; do
            tag=$(basename "$f" .log)
            gzip -9c "$f" | base64 -w0 > "$RUNNER_TEMP/$tag.b64"
            total=$(wc -c < "$RUNNER_TEMP/$tag.b64")
            rm -f "$RUNNER_TEMP/$tag.piece-"*
            split -b 3900 -d -a 3 "$RUNNER_TEMP/$tag.b64" "$RUNNER_TEMP/$tag.piece-"
            pieces=$(ls "$RUNNER_TEMP/$tag.piece-"* | wc -l)
            # A tiny script so the tail is emitted from a later step, where the annotation budget is
            # still empty.
            {
              echo "tail -n 25 \"$f\" | tac | cut -c1-380 | while IFS= read -r line; do"
              echo "  echo \"::notice title=Log end::$line\""
              echo "done"
            } > "$RUNNER_TEMP/tail-$tag.sh"
            echo "::notice title=Log payload::$tag - $total base64 characters in $pieces piece(s), so $(( (pieces + 9) / 10 )) step(s)"
          done

      - name: Hand back the log payload (pieces 1-10)
        if: always()
        run: |
          shopt -s nullglob
          for piece in "$RUNNER_TEMP"/ci-build-*.piece-*; do
            n=$(basename "$piece" | sed 's/.*piece-//')
            if [ "$((10#$n))" -le 10 ]; then
              echo "::notice title=$(basename "$piece" | sed 's/.piece-/-/')::$(cat "$piece")"
            fi
          done

      - name: Hand back the log payload (pieces 11-20)
        if: always()
        run: |
          shopt -s nullglob
          for piece in "$RUNNER_TEMP"/ci-build-*.piece-*; do
            n=$(basename "$piece" | sed 's/.*piece-//')
            if [ "$((10#$n))" -gt 10 ] && [ "$((10#$n))" -le 20 ]; then
              echo "::notice title=$(basename "$piece" | sed 's/.piece-/-/')::$(cat "$piece")"
            fi
          done

      # The end of the log read newest-first, and the same bytes offered to the check-run API - the
      # pieces above are the channel that is known to work, so both of these are best-effort.
      - name: Report the end of the log and try the check-run channel
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          for script in "$RUNNER_TEMP"/tail-*.sh; do
            if [ -f "$script" ]; then bash "$script"; fi
          done

          posted=0
          for piece in "$RUNNER_TEMP"/ci-build-*.piece-*; do
            name="$(basename "$piece" | sed 's/.piece-/-/')"
            rm -f "$RUNNER_TEMP/error.txt"
            if jq -n --arg name "$name" --arg sha "$GITHUB_SHA" --arg text "$(cat "$piece")" \
                 '{name:$name, head_sha:$sha, status:"completed", conclusion:"neutral",
                   output:{title:$name, text:$text}}' > "$RUNNER_TEMP/body.json" 2>>"$RUNNER_TEMP/error.txt" \
               && gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
                    --input "$RUNNER_TEMP/body.json" >> "$RUNNER_TEMP/posted.txt" 2>>"$RUNNER_TEMP/error.txt"; then
              posted=$(( posted + 1 ))
            else
              reason=$(head -c 300 "$RUNNER_TEMP/error.txt" | tr -d '\r\n')
              echo "::warning title=Check run refused::$name - ${reason:-no error text}"
            fi
          done
          echo "::notice title=Check runs posted::$posted piece(s) accepted by the API"

      - name: Save Library cache
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/save@v4
        with:
          path: Library
          key: Library-Android-${{ github.sha }}

      # Which Unity image actually ran, and what the job cost in disk, are the two facts a failed
      # run otherwise buries in a very long log. Annotations are cheap and survive where the log is
      # not to hand.
      - name: Report the image and the disk
        if: always()
        run: |
          echo "=== docker images ==="
          docker images --format '{{.Repository}}:{{.Tag}} - {{.Size}}' || true
          while IFS= read -r img; do
            [ -z "$img" ] && continue
            echo "::notice title=Unity image used::$img"
          done < <(docker images --format '{{.Repository}}:{{.Tag}} - {{.Size}}' | grep -E 'unityci' || true)
          df -h /
          echo "::notice title=Disk after the build::$(( $(df -Pk / | awk 'NR==2 {print $4}') / 1024 / 1024 )) GB free on /"

      - name: Report what was produced
        id: report
        if: always()
        run: |
          echo "### APK" >> "$GITHUB_STEP_SUMMARY"
          # Spelled true/false, not 1/0: the release job's guard compares this against the string
          # 'true', and an integer 1 never matched it, so a real APK was built and then never
          # published. The comparison is string-typed either way.
          found=false
          while IFS= read -r apk; do
            [ -z "$apk" ] && continue
            found=true
            size=$(stat -c %s "$apk")
            sha=$(sha256sum "$apk" | cut -d' ' -f1)
            echo "- \`$apk\` - $size bytes" >> "$GITHUB_STEP_SUMMARY"
            echo "- sha256 \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
            echo "$apk  $size bytes  sha256=$sha"
            echo "::notice title=APK produced::$apk - $size bytes - sha256 $sha"
            echo "apk_name=$(basename "$apk")" >> "$GITHUB_OUTPUT"
            echo "apk_size=$size" >> "$GITHUB_OUTPUT"
            echo "apk_sha=$sha" >> "$GITHUB_OUTPUT"
          done < <(find Builds -name '*.apk' 2>/dev/null | sort)
          echo "apk_found=$found" >> "$GITHUB_OUTPUT"
          if [ "$found" = "false" ]; then
            echo "No APK was produced. The real error is in the build step's log above, not here." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::No APK was produced by this run; the build step above holds the real error."
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aether-dev-apk
          path: Builds/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      # The captured build output, so a failure can be read in a browser instead of hunted for in the
      # job log. Kept short-lived; it is diagnostic material, not a deliverable.
      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-log
          path: ci-build*.log
          if-no-files-found: ignore
          retention-days: 7

  # The release-facing half of the same pipeline, not a second one: it takes the artifact the build
  # job produced and publishes it where a phone can download it. The tag and asset naming follow the
  # pattern this project's release links already use — tag `apk-<short sha>`, asset
  # `<Project>_<version>_<short sha>.apk` beside a `SHA256SUMS.txt`.
  #
  # It runs only when a build actually produced an APK (`apk_found`), so a failed build can never
  # publish an empty or stale release. `contents: write` is granted to this job alone; the build job
  # stays read-only.
  release:
    name: Publish Aether-dev.apk as a Release
    needs: apk
    if: needs.apk.outputs.apk_found == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Aether-dev-apk
          path: release

      - name: Name the assets and verify the bytes survived the transfer
        id: assets
        env:
          # What the build job hashed in its own workspace, before the artifact round trip.
          BUILD_SHA: ${{ needs.apk.outputs.apk_sha }}
          BUILD_SIZE: ${{ needs.apk.outputs.apk_size }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          apk=$(find release -name '*.apk' | sort | head -1)
          if [ -z "$apk" ]; then
            echo "::error::The build job reported an APK but the artifact contains none."
            exit 1
          fi

          asset="Aether_0.1.0_${short}.apk"
          cp "$apk" "$asset"
          size=$(stat -c %s "$asset")
          sha=$(sha256sum "$asset" | cut -d' ' -f1)
          sha256sum "$asset" > SHA256SUMS.txt

          if [ -n "${BUILD_SHA:-}" ] && [ "$sha" != "$BUILD_SHA" ]; then
            echo "::error::The downloaded APK does not match what the build hashed ($sha != $BUILD_SHA)."
            exit 1
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=apk-${short}" >> "$GITHUB_OUTPUT"
          cat SHA256SUMS.txt
          echo "::notice title=Release asset::$asset - $size bytes - sha256 $sha (matches the build: yes)"

      # The API rather than `gh release`: on this repository `gh release create` is answered with
      # a 403 while a plain POST to the same endpoint is answered 201, and the point of the job is
      # the release, not the client. The sequence is create a draft, upload the assets, publish it,
      # and then use the published link before announcing it.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.assets.outputs.tag }}
          ASSET: ${{ steps.assets.outputs.asset }}
          SIZE: ${{ steps.assets.outputs.size }}
          SHA: ${{ steps.assets.outputs.sha }}
        run: |
          set -uo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth="Authorization: token $GH_TOKEN"
          acc="Accept: application/vnd.github+json"
          notes="Android debug build of Project Aether (Unity 6000.3.24f1) from commit \`$GITHUB_SHA\`, built and published by the Android APK workflow. Debug-signed, for play-testing only. Asset \`$ASSET\`, $SIZE bytes, sha256 \`$SHA\`."

          rel=$(curl -sS --max-time 120 -H "$auth" -H "$acc" "$api/releases?per_page=100" \
                  | jq -r --arg t "$TAG" '.[] | select(.tag_name == $t) | .id' | head -1)
          echo "release for $TAG: ${rel:-none yet}"
          if [ -z "$rel" ]; then
            payload=$(jq -n --arg tag "$TAG" --arg name "Aether dev build ${TAG#apk-}" \
                        --arg body "$notes" --arg target "$GITHUB_SHA" \
                        '{tag_name:$tag, name:$name, body:$body, draft:true, target_commitish:$target}')
            answer=$(curl -sS --max-time 120 -X POST -H "$auth" -H "$acc" \
                       -H 'Content-Type: application/json' -d "$payload" "$api/releases")
            rel=$(printf '%s' "$answer" | jq -r '.id // empty')
            if [ -z "$rel" ]; then
              echo "::error title=Release creation refused::$(printf '%s' "$answer" | tr '\n' '|' | head -c 400)"
              exit 1
            fi
          fi

          uploads="https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$rel/assets"
          for f in "$ASSET" SHA256SUMS.txt; do
            name=$(basename "$f")
            old=$(curl -sS --max-time 120 -H "$auth" "$api/releases/$rel/assets" \
                    | jq -r --arg n "$name" '.[] | select(.name == $n) | .id' | head -1)
            if [ -n "$old" ]; then
              curl -sS --max-time 120 -X DELETE -H "$auth" "$api/releases/assets/$old" >/dev/null 2>&1 || true
            fi
            answer=$(curl -sS --max-time 1800 -X POST -H "$auth" \
                       -H 'Content-Type: application/octet-stream' --data-binary "@$f" \
                       "$uploads?name=$name")
            got=$(printf '%s' "$answer" | jq -r '.name // empty')
            if [ -z "$got" ]; then
              echo "::error title=Asset upload refused::$name - $(printf '%s' "$answer" | tr '\n' '|' | head -c 400)"
              exit 1
            fi
            echo "uploaded $got ($(printf '%s' "$answer" | jq -r '.size') bytes)"
          done

          payload=$(jq -n --arg name "Aether dev build ${TAG#apk-}" --arg body "$notes" \
                      '{draft:false, name:$name, body:$body}')
          answer=$(curl -sS --max-time 180 -X PATCH -H "$auth" -H "$acc" \
                     -H 'Content-Type: application/json' -d "$payload" "$api/releases/$rel")
          if [ "$(printf '%s' "$answer" | jq -r '.draft')" != "false" ]; then
            echo "::error title=Release could not be published::$(printf '%s' "$answer" | tr '\n' '|' | head -c 400)"
            exit 1
          fi

          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$ASSET"
          # Use the link before announcing it: fetch the asset back the way a browser download
          # resolves and compare it with the bytes this job hashed.
          asset_id=$(curl -sS --max-time 120 -H "$auth" "$api/releases/$rel/assets" \
                       | jq -r --arg n "$ASSET" '.[] | select(.name == $n) | .id' | head -1)
          if curl -sS -L --location-trusted --max-time 1800 -H "$auth" \
               -H 'Accept: application/octet-stream' -o back.bin "$api/releases/assets/$asset_id"; then
            back=$(sha256sum back.bin | cut -d' ' -f1)
            if [ "$back" = "$SHA" ]; then
              echo "::notice title=Direct APK download::$url - $SIZE bytes - sha256 $SHA - verified by downloading the published asset back"
            else
              echo "::error title=Published asset mismatch::re-downloaded bytes hash to $back, not $SHA"
              exit 1
            fi
          else
            echo "::error title=Published asset unreadable::the asset could not be fetched back"
            exit 1
          fi

          {
            echo "### Release"
            echo ""
            echo "$url"
            echo ""
            echo "- $SIZE bytes"
            echo "- sha256 $SHA"
          } >> "$GITHUB_STEP_SUMMARY"
