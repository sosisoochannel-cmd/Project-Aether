# Android APK build for Project Aether, on GitHub's own runners.
#
# The pipeline in one line: check out the repository, let GameCI provide Unity 6000.3.24f1 in a
# container, activate the Unity Personal license from the account's own credentials, build an
# Android APK, and upload it as a downloadable artifact.
#
# **Nothing here needs a PC.** Unity's editor, the Android SDK/NDK and the JDK all live on
# GitHub's runner for the length of the job; the only things the account owner supplies are their
# Unity account email and password, stored as repository secrets. See docs/CI.md.
#
# Licensing, stated plainly because this is the part people get wrong: no .ulf file and no serial
# key are used. GameCI's CLI resolves the licensing strategy itself in the order
# file -> serial -> floating -> personal, and with only account credentials present it activates a
# Personal seat inside the container and returns it when the build ends. That is a real,
# account-bound Unity Personal license being used exactly as Unity's own tooling intends — not a
# bypass, not a cracked license, and not a fabricated one. The strategy order and the
# activate/return pairing are in game-ci/cli (`licensing-method.ts`, `run-licensing-probe-cell.sh`),
# and the only cell GameCI records as failing across the versions they measure is 2020.3.49f1,
# whose bundled licensing client predates the `--include-personal` flag this path needs.

name: Android APK

on:
  push:
    branches:
      - main
      - arena/01a10203-project-aether
    # Documentation cannot change an APK, and a build spends real minutes from the month's free
    # allowance, so a docs-only push should not start one.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

# A build spends the account's monthly Actions minutes, and a run cancelled mid-build can leave a
# Personal seat bound to a machine that no longer exists — released by hand at id.unity.com. So a
# newer push queues behind the older run instead of killing it.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check Unity credentials
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Verify the secrets exist
        id: check
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSING_SERVER: ${{ secrets.UNITY_LICENSING_SERVER }}
        run: |
          # Values are never printed; only whether they are present.
          ready=true
          if [ -z "$UNITY_EMAIL" ]; then
            echo "::warning::Repository secret UNITY_EMAIL is missing, so no license can be activated."
            ready=false
          fi
          if [ -z "$UNITY_PASSWORD" ]; then
            echo "::warning::Repository secret UNITY_PASSWORD is missing, so no license can be activated."
            ready=false
          fi
          if [ "$ready" = "true" ]; then
            echo "Unity account credentials are present. The build job will run."
          else
            echo "Add both secrets under Settings -> Secrets and variables -> Actions, then re-run this workflow from the Actions tab."
          fi

          # Shape checks, booleans only — the values themselves never reach the log. Unity answers a
          # password with a stray trailing space or newline exactly as it answers a wrong password
          # ("credentials rejected"), and pasting on a phone is where that usually comes from.
          email_shape="no"; email_ws="clean"
          case "$UNITY_EMAIL" in *@*.*) email_shape="yes";; esac
          case "$UNITY_EMAIL" in *[[:space:]]*) email_ws="contains whitespace";; esac
          pw_ws="clean"; pw_len="too short"
          case "$UNITY_PASSWORD" in *[[:space:]]*) pw_ws="contains whitespace";; esac
          [ "${#UNITY_PASSWORD}" -ge 8 ] && pw_len="at least 8 characters"
          echo "::notice title=Credential shape::UNITY_EMAIL looks like an address: $email_shape (whitespace: $email_ws); UNITY_PASSWORD length: $pw_len (whitespace: $pw_ws)"

          # Which licensing credentials exist decides which strategy GameCI picks on its own, and a
          # stray .ulf or serial silently outranks the account credentials in that choice. Names
          # only - never values.
          present=""
          [ -n "$UNITY_LICENSE" ] && present="$present UNITY_LICENSE"
          [ -n "$UNITY_SERIAL" ] && present="$present UNITY_SERIAL"
          [ -n "$UNITY_LICENSING_SERVER" ] && present="$present UNITY_LICENSING_SERVER"
          if [ -z "$present" ]; then present="none (account credentials only, which means the personal strategy)"; fi
          echo "::notice title=Other licence secrets::$present"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

  apk:
    name: Unity 6000.3.24f1 -> Aether-dev.apk
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      apk_found: ${{ steps.report.outputs.apk_found }}
      apk_name: ${{ steps.report.outputs.apk_name }}
      apk_size: ${{ steps.report.outputs.apk_size }}
      apk_sha: ${{ steps.report.outputs.apk_sha }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Library is Unity's import cache. Restoring it turns a multi-minute import into seconds.
      # Restore and save are split deliberately: the combined cache step's implicit post-run save
      # has been observed hanging on hosted runners (see the comment in GameCI's own build
      # workflow), and an explicit step can be bounded by a timeout.
      # Why this exists: GitHub gives a *private* repository's runner a 2-core VM with a 75 GB disk of
      # which only ~14 GB is free (actions/runner-images#14492, GitHub staff, 2026-08-05; public repos
      # get 150 GB with ~90 GB free), and the Unity Android image must unpack far more than that into
      # /var/lib/docker. That is exactly how the first real run died:
      #   docker: failed to register layer: write .../AndroidPlayer/Variations/il2cpp/.../libunity.so:
      #   no space left on device
      # GameCI's own troubleshooting page names this failure and its first remedy is to free disk
      # space. Every path below is a host-side toolchain that a *container* build cannot use: the
      # editor, the Android SDK/NDK and the JDK all live inside the unityci/editor image, this
      # workflow calls no setup-* action, and unity-builder v6 is a node24 action that runs on the
      # runner's bundled Node rather than anything in the tool cache. Deliberately untouched: the
      # workspace and .git, the Unity project, the actions runtime, the Docker daemon, and swap —
      # the standard runner has 8 GB of RAM and an IL2CPP build is the thing most likely to want it.
      - name: Free disk space
        id: space
        run: |
          set -euo pipefail

          free_mb() { df -Pk / | awk 'NR==2 {print int($4/1024)}'; }

          before=$(free_mb)
          total=$(df -Ph / | awk 'NR==2 {print $2}')
          echo "=== disk before cleanup ==="
          df -h /
          docker system df || true
          echo "::notice title=Disk before cleanup::$((before/1024)) GB free of ${total} on /"

          saved=0
          remove_path() { # $1 = path, $2 = label
            if [ ! -e "$1" ]; then
              echo "- $2: not present"
              return 0
            fi
            local b a size
            b=$(free_mb)
            size=$(sudo du -sh "$1" 2>/dev/null | cut -f1 || echo "?")
            sudo rm -rf --one-file-system "$1" || true
            a=$(free_mb)
            saved=$(( saved + a - b ))
            echo "- $2: removed $1 (was $size, freed $((a-b)) MB)"
          }

          remove_path /usr/local/lib/android  "host Android SDK/NDK - the build's own SDK is inside the Unity image"
          remove_path "$AGENT_TOOLSDIRECTORY" "pre-installed language runtimes and the CodeQL toolchain"
          remove_path /opt/ghc                "Haskell GHC"
          remove_path /usr/local/.ghcup       "Haskell GHCup data"
          remove_path /usr/share/dotnet       ".NET SDK"
          remove_path /usr/local/share/boost  "Boost headers"

          echo "=== docker prune ==="
          docker image prune --all --force || true
          docker container prune --force || true

          after=$(free_mb)
          echo "=== disk after cleanup ==="
          df -h /
          echo "::notice title=Disk after cleanup::$((after/1024)) GB free on / (was $((before/1024)) GB; ${saved} MB reclaimed)"

          # The image unpacks into /var/lib/docker and the build then needs room for Library/ and the
          # APK. If the fast, file-level cleanup above is not enough, fall back to the slower package
          # sweep from the same documented list, and only then.
          if [ "$((after/1024))" -lt 30 ]; then
            echo "::notice::Under 30 GB free after the file-level cleanup; running the documented package sweep (this takes a few minutes)."
            sudo apt-get remove -y '^llvm-.*' --fix-missing || true
            sudo apt-get remove -y 'php.*' --fix-missing || true
            sudo apt-get remove -y '^mongodb-.*' --fix-missing || true
            sudo apt-get remove -y '^mysql-.*' --fix-missing || true
            sudo apt-get remove -y azure-cli google-chrome-stable firefox powershell mono-devel --fix-missing || true
            sudo apt-get remove -y google-cloud-sdk google-cloud-cli --fix-missing || true
            sudo apt-get autoremove -y || true
            sudo apt-get clean || true
            after=$(free_mb)
            df -h /
            echo "::notice title=Disk after package sweep::$((after/1024)) GB free on /"
          fi

          if [ "$((after/1024))" -lt 25 ]; then
            echo "::warning::Only $((after/1024)) GB free on / after cleanup; the Unity Android image may still not fit."
          fi

      - name: Restore Library cache
        uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-Android-${{ github.sha }}
          restore-keys: |
            Library-Android-

      - name: Install the GameCI CLI
        id: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Pinned, not `latest`: the version that runs is then a fact in the log rather than
          # whatever shipped this morning. This is the same install path the unity-builder action
          # uses (game-ci/cli's own scripts/install.sh, fetched at the tag), so the binary and its
          # checksum verification are GameCI's, not a reimplementation.
          version="v0.1.72"
          script="$RUNNER_TEMP/game-ci-install.sh"
          if ! curl -fsSL "https://raw.githubusercontent.com/game-ci/cli/$version/scripts/install.sh" -o "$script"; then
            # raw.githubusercontent.com is the documented source; the API is the authenticated fallback.
            curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/game-ci/cli/contents/scripts/install.sh?ref=$version" -o "$script"
          fi
          dest="$RUNNER_TEMP/game-ci"
          mkdir -p "$dest"
          bin=$(bash "$script" "$version" "$dest" | tail -n 1)
          test -x "$bin" || { echo "::error::install.sh did not produce an executable ($bin)"; exit 1; }
          "$bin" --version || true
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          echo "::notice title=game-ci CLI::installed $version -> $bin"

      - name: Build APK
        id: build
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # Empty when unset, and only ever used by the second attempt below.
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSING_SERVER: ${{ secrets.UNITY_LICENSING_SERVER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          # The same command the `game-ci/unity-builder` action runs, called directly so the whole
          # output can be captured to a file. Without that file the only copy of a failure is the
          # job log, which is 25,000 lines and not readable from a phone or from the API.
          attempt() {
            local method="$1"
            echo "### Attempt: unityLicensingMethod=$method"
            "${{ steps.cli.outputs.bin }}" build \
              --targetPlatform=Android \
              --androidExportType=androidPackage \
              --buildName=Aether-dev \
              --buildsPath=Builds \
              --versioningStrategy=Custom \
              --version=0.1.0 \
              --allowDirtyBuild \
              --unityLicensingMethod="$method" 2>&1 | tee "ci-build-$method.log"
            return "${PIPESTATUS[0]}"
          }

          status=1
          # Personal first, and forced: with only an email and a password configured, `auto` resolves
          # to `personal` anyway, and forcing it means a stray license secret cannot silently switch
          # the strategy out from under the run.
          attempt personal && status=0

          if [ "$status" != 0 ]; then
            echo "::notice title=Attempt 1 failed::personal licensing failed; see ci-build-personal.log"
            # A second attempt is only worth its minutes if the account supplied something the first
            # (forced) strategy was told to ignore - a .ulf or a serial.
            if [ -n "${UNITY_LICENSE:-}" ] || [ -n "${UNITY_SERIAL:-}" ]; then
              echo "A license file or serial secret is present, so retrying with the automatic strategy."
              attempt auto && status=0
            else
              echo "No .ulf and no serial are configured, so there is no second strategy to try."
            fi
          fi

          exit "$status"

      # A failed Unity build is only diagnosable from the container's output, and that output lands in
      # a 25,000-line job log. These lines are re-emitted as workflow commands, which become
      # annotations on the run - visible from a phone, and readable through the API when the log
      # itself is not. Passwords are filtered out on principle even though GitHub masks secret values.
      - name: Surface what the container said
        if: always()
        run: |
          shopt -s nullglob
          files=(ci-build-*.log)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning title=No captured log::The build step produced no ci-build-*.log file."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "::notice title=Captured log::$f - $(wc -l < "$f") lines"
            grep -nEi 'error|exception|licens|entitlement|seat|factor|verification|unauthorized|invalid (username|password|credentials)|denied|machine binding|no space|not found|failed' "$f" \
              | grep -vEi 'Verifying Checksum|Pulling fs layer|Download complete|Waiting|Extracting|Node\.js 20 is deprecated|DeprecationWarning|no space left on device:: (false)|warning::' \
              | grep -v -- '--password' \
              | cut -c1-450 | head -45 \
              | while IFS= read -r line; do echo "::error title=Unity build log::$line"; done
            # The tail is where the failure banner and the exit reasoning live.
            tail -n 12 "$f" | cut -c1-450 | grep -v -- '--password' \
              | while IFS= read -r line; do echo "::notice title=Log tail::$line"; done
          done

      - name: Save Library cache
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/save@v4
        with:
          path: Library
          key: Library-Android-${{ github.sha }}

      # Which Unity image actually ran, and what the job cost in disk, are the two facts a failed
      # run otherwise buries in a very long log. Annotations are cheap and survive where the log is
      # not to hand.
      - name: Report the image and the disk
        if: always()
        run: |
          echo "=== docker images ==="
          docker images --format '{{.Repository}}:{{.Tag}} - {{.Size}}' || true
          while IFS= read -r img; do
            [ -z "$img" ] && continue
            echo "::notice title=Unity image used::$img"
          done < <(docker images --format '{{.Repository}}:{{.Tag}} - {{.Size}}' | grep -E 'unityci' || true)
          df -h /
          echo "::notice title=Disk after the build::$(( $(df -Pk / | awk 'NR==2 {print $4}') / 1024 / 1024 )) GB free on /"

      - name: Report what was produced
        id: report
        if: always()
        run: |
          echo "### APK" >> "$GITHUB_STEP_SUMMARY"
          found=0
          while IFS= read -r apk; do
            [ -z "$apk" ] && continue
            found=1
            size=$(stat -c %s "$apk")
            sha=$(sha256sum "$apk" | cut -d' ' -f1)
            echo "- \`$apk\` - $size bytes" >> "$GITHUB_STEP_SUMMARY"
            echo "- sha256 \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
            echo "$apk  $size bytes  sha256=$sha"
            echo "::notice title=APK produced::$apk - $size bytes - sha256 $sha"
            echo "apk_name=$(basename "$apk")" >> "$GITHUB_OUTPUT"
            echo "apk_size=$size" >> "$GITHUB_OUTPUT"
            echo "apk_sha=$sha" >> "$GITHUB_OUTPUT"
          done < <(find Builds -name '*.apk' 2>/dev/null | sort)
          echo "apk_found=$found" >> "$GITHUB_OUTPUT"
          if [ "$found" = "0" ]; then
            echo "No APK was produced. The real error is in the build step's log above, not here." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::No APK was produced by this run; the build step above holds the real error."
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aether-dev-apk
          path: Builds/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      # The captured build output, so a failure can be read in a browser instead of hunted for in the
      # job log. Kept short-lived; it is diagnostic material, not a deliverable.
      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-log
          path: ci-build-*.log
          if-no-files-found: ignore
          retention-days: 7

  # The release-facing half of the same pipeline, not a second one: it takes the artifact the build
  # job produced and publishes it where a phone can download it. The tag and asset naming follow the
  # pattern this project's release links already use — tag `apk-<short sha>`, asset
  # `<Project>_<version>_<short sha>.apk` beside a `SHA256SUMS.txt`.
  #
  # It runs only when a build actually produced an APK (`apk_found`), so a failed build can never
  # publish an empty or stale release. `contents: write` is granted to this job alone; the build job
  # stays read-only.
  release:
    name: Publish Aether-dev.apk as a Release
    needs: apk
    if: needs.apk.outputs.apk_found == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Aether-dev-apk
          path: release

      - name: Name the assets and verify the bytes survived the transfer
        id: assets
        env:
          # What the build job hashed in its own workspace, before the artifact round trip.
          BUILD_SHA: ${{ needs.apk.outputs.apk_sha }}
          BUILD_SIZE: ${{ needs.apk.outputs.apk_size }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          apk=$(find release -name '*.apk' | sort | head -1)
          if [ -z "$apk" ]; then
            echo "::error::The build job reported an APK but the artifact contains none."
            exit 1
          fi

          asset="Aether_0.1.0_${short}.apk"
          cp "$apk" "$asset"
          size=$(stat -c %s "$asset")
          sha=$(sha256sum "$asset" | cut -d' ' -f1)
          sha256sum "$asset" > SHA256SUMS.txt

          if [ -n "${BUILD_SHA:-}" ] && [ "$sha" != "$BUILD_SHA" ]; then
            echo "::error::The downloaded APK does not match what the build hashed ($sha != $BUILD_SHA)."
            exit 1
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=apk-${short}" >> "$GITHUB_OUTPUT"
          cat SHA256SUMS.txt
          echo "::notice title=Release asset::$asset - $size bytes - sha256 $sha (matches the build: yes)"

      # `gh` rather than a third-party release action: it is already on the runner, and a token with
      # `contents: write` is all this needs.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.assets.outputs.tag }}
          ASSET: ${{ steps.assets.outputs.asset }}
          SIZE: ${{ steps.assets.outputs.size }}
          SHA: ${{ steps.assets.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its assets."
            gh release upload "$TAG" "$ASSET" SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$ASSET" SHA256SUMS.txt \
              --title "Aether dev build ${TAG#apk-}" \
              --target "$GITHUB_SHA" \
              --notes "Android debug build of Project Aether (Unity 6000.3.24f1) from commit \`$GITHUB_SHA\`, built and published by the Android APK workflow. Debug-signed, for play-testing only.

          \`$ASSET\` — $SIZE bytes — sha256 \`$SHA\`"
          fi
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$ASSET"
          echo "### Release" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Direct APK download::$url"
