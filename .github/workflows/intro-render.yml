# Temporary: render the studio intro inside the real Unity, and photograph what comes out.
#
# The intro's layout is proved by arithmetic in tools/verify/intro.py, but arithmetic cannot see
# what the renderer draws - the bug that made the mark fill the screen passed every static check.
# This job loads the shipped scene on the runner, lets the shipped component play, captures the
# frames, and measures them: ink present, centred, inside the frame, aspect preserved, black ground,
# and a reveal and exit that actually change. The PNGs and the measurements are uploaded.
#
# It builds nothing, and it is ignored by the build workflow's path filter, so iterating on it never
# spends an Android build. Deleted once the screenshots have been handed over.
#
# This job cannot be read from the environment that drives it: the runner logs and the artifact zip
# both live on Azure blob storage, which that environment cannot reach. So the interesting lines are
# re-emitted as workflow annotations, which can be read - the same channel the build workflow's
# Unity log uses.
name: Intro render (temporary)

on:
  push:
    branches:
      - arena/257547c7-project-aether
    paths:
      - '.github/workflows/intro-render.yml'
      - 'Assets/Aether/Code/Aether.Tests.PlayMode/**'
      # While the menu is being verified, the game's own code belongs in this list: a change to the
      # game is precisely the change the play-mode tests have to answer for, and this workflow is
      # the only place they run. It is ignored by the APK workflow's path filter, so a push that
      # only touches a verifier still cannot spend a build.
      - 'Assets/Aether/Code/Aether.Gameplay/**'
      - 'Assets/Aether/Code/Aether.Core/**'
      - 'Assets/Aether/Code/Aether.Data/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intro-render-${{ github.ref }}
  # Let one verification finish; newer commits replace the pending run instead of cancelling
  # the active static suite halfway through its 98 regression controls.
  cancel-in-progress: false

jobs:
  render:
    name: Play the intro and photograph it
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Run the full repository-specific static suite before starting Unity. This catches broken
      # asset references, assembly edges, localization drift, unreachable level geometry, menu
      # layout regressions and deliberately injected negative cases without producing an APK.
      - name: Run static project gates (no APK build)
        run: |
          set -euo pipefail
          python3 tools/verify/gen_meta.py --check
          python3 tools/verify/verify.py
          python3 tools/verify/localization.py
          python3 tools/verify/levelcheck.py
          python3 tools/verify/intro.py
          python3 tools/verify/touchlayout.py
          python3 tools/verify/mainmenu.py
          python3 tools/verify/negative_controls.py

      # The Unity image unpacks into /var/lib/docker and the import needs room afterwards, on a VM
      # that starts with about 14 GB free. Only host-side toolchains a *container* run cannot use
      # are removed - the editor, SDK, NDK and JDK all live inside the image.
      - name: Free disk space
        run: |
          set -euo pipefail
          df -h /
          remove_path() {
            [ -e "$1" ] || { echo "- $2: not present"; return 0; }
            sudo rm -rf --one-file-system "$1" || true
            echo "- $2: removed $1"
          }
          remove_path /usr/local/lib/android "host Android SDK/NDK"
          remove_path "$AGENT_TOOLSDIRECTORY" "pre-installed language runtimes"
          remove_path /opt/ghc "Haskell GHC"
          remove_path /usr/local/.ghcup "Haskell GHCup"
          remove_path /usr/share/dotnet ".NET SDK"
          remove_path /usr/local/share/boost "Boost headers"
          docker image prune --all --force || true
          df -h /
          echo "::notice title=Disk::$(df -Ph / | awk 'NR==2 {print $4}') free on /"

      # The import is the slow part and the build job already paid for it once.
      - name: Restore Library cache
        uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-Android-${{ github.sha }}
          restore-keys: |
            Library-Android-

      - name: Install the GameCI CLI
        id: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="v0.1.72"
          script="$RUNNER_TEMP/game-ci-install.sh"
          if ! curl -fsSL "https://raw.githubusercontent.com/game-ci/cli/$version/scripts/install.sh" -o "$script"; then
            curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/game-ci/cli/contents/scripts/install.sh?ref=$version" -o "$script"
          fi
          dest="$RUNNER_TEMP/game-ci"
          mkdir -p "$dest"
          bin=$(bash "$script" "$version" "$dest" | tail -n 1)
          test -x "$bin" || { echo "::error::install.sh did not produce an executable ($bin)"; exit 1; }
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          echo "::notice title=game-ci CLI::installed $version -> $bin"

      # The CLI's own exit code is recorded, not obeyed: it crashes after the run with
      # "InvalidCharacterError: The string contains invalid characters" from its Android keystore
      # setup (setupAndroidRun), which has nothing to do with the test. What actually happened is
      # judged below, from the test framework's own results and from whether frames were written.
      - name: Run the intro render test
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -uo pipefail
          status=0
          "${{ steps.cli.outputs.bin }}" test --docker \
            --targetPlatform=Android \
            --testPlatforms=playmode \
            --artifactsPath=artifacts \
            --coverageEnabled=false \
            > intro-render.log 2>&1 || status=$?
          echo "$status" > test-status.txt
          echo "::notice title=Test command exit::$status (recorded, not obeyed - see the verdict step)"
          true

      # Everything that says why the run failed is somewhere in the results or the log, and the whole
      # point of this step is to get it out of the runner: the logs and artifacts themselves live on
      # storage the environment driving this cannot read. Annotations carry a lot if the newlines are
      # flattened, and %25 goes first so a literal % in the text cannot be read as an escape.
      #
      # Nothing here is cut per line. The first version of this step cut every line at 500 characters,
      # which silently removed the one thing it exists to report: a test failure message is a single
      # very long line of XML, so the annotation showed the <testsuite> header and none of the reason.
      #
      # The one deliberate cut is on a file that is known to be enormous.
      - name: Surface what the run said
        if: always()
        run: |
          shopt -s nullglob
          emit() { # $1 title, $2 file, $3 chars
            local title="$1" file="$2" chars="${3:-5600}" body
            [ -f "$file" ] || { echo "::warning title=$title::no file at $file"; return 0; }
            body=$(tr '\r' '\n' < "$file" | awk 'NF' | sed -e 's/%/%25/g' | tr '\n' '|' | head -c "$chars")
            [ -n "$body" ] && echo "::notice title=${title}::${body}"
          }
          emit_big() { # same, but only lines worth carrying
            local title="$1" file="$2" chars="${3:-5600}" body
            [ -f "$file" ] || { echo "::warning title=$title::no file at $file"; return 0; }
            body=$(tr '\r' '\n' < "$file" \
                   | grep -n -E '\[intro-render\]|Exception|error CS|Assert|Expected|But was|failed|Error|Crash|Aborting|not supported|Captur|Batchmode|batchmode|safe ?area' \
                   | sed -e 's/%/%25/g' | tr '\n' '|' | head -c "$chars")
            [ -n "$body" ] && echo "::notice title=${title}::${body}"
          }

          echo "::notice title=Test command exit::$(cat test-status.txt 2>/dev/null || echo '?')"
          echo "::notice title=Files::$(ls -lR IntroRender artifacts 2>/dev/null | tr '\n' '|' | head -c 1200)"

          # The test framework's own results: the message and stack of any failure are attributes on
          # the <test-case> element, so the whole file is what needs reading.
          for f in artifacts/*.xml *.xml; do emit "Results $(basename "$f")" "$f" 5600; done

          # The test writes what it saw as it goes, so a failure explains itself here.
          [ -f IntroRender/diagnostics.txt ] && emit "Diagnostics" IntroRender/diagnostics.txt 5600

          if [ -f IntroRender/summary.txt ]; then
            emit "Rendered frames" IntroRender/summary.txt 3000
          else
            emit "Render log head" intro-render.log 4000
            emit "Render log tail" intro-render.log 5600
          fi

          # The screenshot itself, out through the one channel that works from here: the artifact zip
          # is on Azure blob storage, which the environment driving this cannot reach. Emitted
          # whenever the frames exist, however the run ended.
          # Best two, most informative first, whichever of them the run actually produced: a run
          # that failed early still has one frame, and that frame is the evidence.
          sent=0
          for f in IntroRender/intro-1.55s-small.png IntroRender/intro-2.62s-small.png \
                   IntroRender/intro-0.50s-small.png IntroRender/intro-3.40s-small.png; do
            [ -f "$f" ] || continue
            [ "$sent" -lt 2 ] || break
            echo "::notice title=Frame $(basename "$f")::$(base64 -w0 "$f" | head -c 60000)"
            sent=$((sent + 1))
          done
          [ "$sent" -eq 0 ] && echo "::warning title=No frames::the test wrote no frame at all"

          # Always, whichever way it went: the intro's own measurements and anything the engine threw.
          emit_big "Render log signals" intro-render.log 5600
          for f in artifacts/*.log artifacts/*/*.log; do emit_big "Artifact $(basename "$f")" "$f" 5600; done

      - name: Save Library cache
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/save@v4
        with:
          path: Library
          key: Library-Android-${{ github.sha }}

      # The verdict: the test framework's own numbers, and whether the frames exist. A run that
      # produced every measured frame with nothing failing has done its job, whatever the CLI's
      # exit code was.
      - name: Judge the run
        if: always()
        run: |
          results=$(cat artifacts/playmode-results.xml 2>/dev/null || echo "")
          [ -n "$results" ] || results=$(cat $(ls artifacts/*results*.xml artifacts/*.xml 2>/dev/null | head -1) 2>/dev/null || echo "")
          failed=$(printf '%s' "$results" | grep -o 'failed="[0-9]*"' | head -1 | grep -o '[0-9]*' || echo "?")
          total=$(printf '%s' "$results" | grep -o 'total="[0-9]*"' | head -1 | grep -o '[0-9]*' || echo "?")
          frames=$(ls IntroRender/*-small.png 2>/dev/null | wc -l)   # one per moment, not per copy
          echo "::notice title=Verdict::tests total=$total failed=$failed, frames written=$frames"
          if [ -z "$results" ]; then
            # No results file at all means the editor never got as far as running the tests - a
            # compilation error, a licence, a crash. Saying "? test(s) failed" would hide that.
            echo "::error::no test results were produced; the editor did not get as far as running the tests (see the log signals above)"
            exit 1
          fi
          if [ "$failed" != "0" ]; then
            # Which test failed, by name, and what it said. The results file is one long line of
            # XML and the name is an attribute on a <test-case> element inside it, which the grep
            # below cannot pick out: an earlier version of this step reported that one test had
            # failed without ever saying which, and the logs and the artifact zip are on storage
            # the environment reading this cannot reach. The tool is in the repository so that it
            # can be run — and tested — outside the runner.
            printf '%s' "$results" > /tmp/results.xml
            failing=$(python3 tools/ci/failing_tests.py /tmp/results.xml 2>/dev/null \
                      | sed -e 's/%/%25/g' | tr '\n' '|' | head -c 5000)
            [ -n "$failing" ] \
              && echo "::error title=Failing tests::${failing}" \
              || echo "::error::the results name $failed failing test(s) that could not be read"

            # The framework's own summary, so the counts travel with the names.
            why=$(printf '%s' "$results" | tr '\r' '\n' \
                  | grep -o -E 'total="[0-9]+"[^>]*failed="[0-9]+"' \
                  | head -1 | sed -e 's/%/%25/g' | tr '\n' '|' | head -c 600)
            [ -n "$why" ] && echo "::notice title=Test totals::${why}"
            exit 1
          fi
          if [ "$total" = "0" ] || [ -z "$results" ]; then
            echo "::error::the test framework ran no tests; the render test was not discovered"
            exit 1
          fi
          if [ "$frames" -lt 8 ]; then
            echo "::error::only $frames frame(s) were written; eight moments were expected"
            exit 1
          fi
          echo "::notice title=Verdict::every moment rendered and measured, no test failures"

      - name: Keep the frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intro-render
          path: |
            IntroRender/**
            artifacts/**
            intro-render.log
          if-no-files-found: warn
          retention-days: 7
