<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Varellon Studios — refined identity concept</title>
  <desc id="desc">A restrained platinum monogram and spaced Varellon Studios wordmark on a deep near-black field.</desc>
  <defs>
    <linearGradient id="platinum" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/><stop offset=".42" stop-color="#D8D9D7"/><stop offset="1" stop-color="#A8B0B0"/>
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B8D0C2"/><stop offset="1" stop-color="#718F83"/>
    </linearGradient>
    <radialGradient id="field" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#151C20"/><stop offset="1" stop-color="#080A0D"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#field)"/>
  <ellipse cx="800" cy="350" rx="210" ry="170" fill="#78988A" opacity=".09" filter="url(#softShadow)"/>
  <g transform="translate(800 320)">
    <path d="M-155 -150 L-85 -150 L0 28 L85 -150 L155 -150 L25 132 L-25 132 Z" fill="url(#platinum)"/>
    <path d="M-67 -150 L-4 -18 L-31 38 L-119 -150 Z" fill="#FFFFFF" opacity=".16"/>
    <path d="M-25 132 L25 132 L0 80 Z" fill="#7D9B8D" opacity=".96"/>
    <path d="M-155 -150 L-119 -150 L-31 38 L-49 0 Z" fill="#F7FAF8" opacity=".38"/>
  </g>
  <path d="M620 526 H980" stroke="url(#sage)" stroke-width="1.5" opacity=".78"/>
  <circle cx="800" cy="526" r="3" fill="#C4D8CC"/>
  <text x="800" y="612" text-anchor="middle" fill="url(#platinum)" font-family="Montserrat, Avenir Next, Helvetica, sans-serif" font-size="76" font-weight="500" letter-spacing="13">VARELLON</text>
  <text x="800" y="674" text-anchor="middle" fill="#A9BEB4" font-family="Montserrat, Avenir Next, Helvetica, sans-serif" font-size="23" font-weight="500" letter-spacing="12">S T U D I O S</text>
  <text x="800" y="790" text-anchor="middle" fill="#69737A" font-family="Montserrat, Avenir Next, Helvetica, sans-serif" font-size="13" font-weight="400" letter-spacing="4">IDENTITY STUDY / 01</text>
</svg>